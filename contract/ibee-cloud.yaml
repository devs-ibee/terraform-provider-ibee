openapi: 3.1.0
info:
  title: IBEE Solutions API
  version: 0.6.2
  description: |
    Public API reference for IBEE Solutions.

    Authenticate with a platform API token and pass a `workspace_id` query
    parameter to scope requests to a specific workspace.

servers:
  - url: https://api.ibee.ai/v1
    description: IBEE production API gateway
    x-fern-server-name: Production
  - url: https://api.ibee.co.in/v1
    description: IBEE development API gateway
    x-fern-server-name: Development

tags:
  - name: Secret Store
    description: Manage secret stores, values, versions, application identities, and access scopes inside a workspace.
  - name: Object Storage
    description: Manage object storage buckets and bucket configuration.
  - name: Vpcs
    description: Build isolated virtual networks, subnets, NAT gateways, and VM attachments.
    x-fern-display-name: VPCs
    x-displayName: VPCs
  - name: ReservedIps
    description: Reserve and attach portable public IPv4 addresses.
    x-fern-display-name: Reserved IPs
    x-displayName: Reserved IPs
  - name: Firewalls
    description: Manage stateful firewall groups, rules, and VM attachments.
  - name: LoadBalancers
    description: Manage L4 and L7 load balancers.
    x-fern-display-name: Load Balancers
    x-displayName: Load Balancers
  - name: ComputeCatalog
    description: Discover sites, plans, and images accepted by VM creation.
    x-fern-display-name: Compute Catalog
    x-displayName: Compute Catalog
  - name: Billing
    description: Check current billing eligibility for a billable resource.
  - name: BlockStorage
    description: Manage standalone persistent block-storage volumes using the same product flow as the portal.
    x-fern-display-name: Block Storage
    x-displayName: Block Storage
  - name: Cdn
    description: Manage CDN distributions, static websites, custom domains, URLs, and cache purges.
    x-fern-display-name: CDN
    x-displayName: CDN
  - name: ContainerRegistry
    description: Manage container registries, storage plans, registry access tokens, repositories, images, vulnerability findings, SBOMs, and usage metrics.
    x-fern-display-name: Container Registry
    x-displayName: Container Registry

  - name: CloudVms
    description: Deploy and manage cloud virtual machines.
    x-fern-display-name: Cloud VMs
    x-displayName: Cloud VMs
  - name: GpuVms
    description: Deploy and manage GPU-accelerated virtual machines.
    x-fern-display-name: GPU VMs
    x-displayName: GPU VMs
  - name: VmConsole
    description: Create and manage short-lived graphical VM console sessions.
    x-fern-display-name: VM Console
    x-displayName: VM Console

security:
  - IbeeApiToken: []

paths:
  /secret-store/stores:
    get:
      tags:
        - Secret Store
      summary: List secret stores
      description: "Lists secret stores in a workspace. Requires scope: secret-store.read."
      operationId: listSecretStores
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include archived stores in the result.
      responses:
        "200":
          description: Stores returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretStoreList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - Secret Store
      summary: Create secret store
      description: "Creates a secret store in a workspace. Requires scope: secret-store.write."
      operationId: createSecretStore
      x-ibee-required-scope: secret-store.write
      x-ibee-billing-admission: required
      x-ibee-billing-sku-source: fixed
      x-ibee-billing-sku: SECRETMA-STD
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretStoreRequest"
            example:
              name: production-secrets
              description: Secrets for production workloads
      responses:
        "201":
          description: Store created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretStore"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/stores/{store_id}:
    get:
      tags:
        - Secret Store
      summary: Get secret store
      description: "Gets one secret store. Requires scope: secret-store.read."
      operationId: getSecretStore
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Store returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /secret-store/stores/{store_id}/archive:
    post:
      tags:
        - Secret Store
      summary: Archive secret store
      description: "Archives a secret store. Requires scope: secret-store.write."
      operationId: archiveSecretStore
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Store archived successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/stores/{store_id}/unarchive:
    post:
      tags:
        - Secret Store
      summary: Unarchive secret store
      description: "Reactivates an archived secret store. Requires scope: secret-store.write."
      operationId: unarchiveSecretStore
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Store reactivated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/stores/{store_id}/permanent:
    delete:
      tags:
        - Secret Store
      summary: Permanently delete secret store
      description: "Irreversibly deletes a store and all store-scoped secrets, versions, identities, and policies. Requires scope: secret-store.write."
      operationId: permanentlyDeleteSecretStore
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Store and its resources permanently deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretLifecycleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/stores/{store_id}/secrets:
    get:
      tags:
        - Secret Store
      summary: List secrets
      description: "Lists secret metadata in a store. Secret values are not returned. Requires scope: secret-store.read."
      operationId: listSecrets
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional search query.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Secrets returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      tags:
        - Secret Store
      summary: Create secret
      description: "Creates a secret in a store. Requires scope: secret-store.write."
      operationId: createSecret
      x-ibee-required-scope: secret-store.write
      x-ibee-billing-admission: required
      x-ibee-billing-sku-source: fixed
      x-ibee-billing-sku: SECRETMA-STD
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
            example:
              secret_name: database-url
              value:
                url: "postgres://user:pass@host:5432/mydb"
      responses:
        "201":
          description: Secret created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/stores/{store_id}/secrets:batchIngest:
    post:
      tags:
        - Secret Store
      summary: Batch-create secrets
      description: "Creates up to 500 secrets without overwriting existing names. Requires scope: secret-store.write."
      operationId: batchCreateSecrets
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateSecretsRequest"
            example:
              secrets:
                - secret_name: database-url
                  value:
                    url: "postgres://user:pass@host:5432/app"
                - secret_name: api-key
                  value:
                    key: "replace-with-your-value"
      responses:
        "200":
          description: Batch processed; inspect each result for created, skipped, or failed status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateSecretsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}:
    get:
      tags:
        - Secret Store
      summary: Get secret metadata
      description: "Gets one secret metadata record. Secret value is not returned. Requires scope: secret-store.read."
      operationId: getSecret
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Secret Store
      summary: Delete secret
      description: "Soft-deletes a secret. Requires scope: secret-store.write."
      operationId: deleteSecret
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/value:
    get:
      tags:
        - Secret Store
      summary: Get secret value
      description: "Gets the latest value for a secret. Requires scope: secret-store.read."
      operationId: getSecretValue
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret value returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretValue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags:
        - Secret Store
      summary: Replace secret value
      description: "Creates a new version of the secret value. Requires scope: secret-store.write."
      operationId: updateSecretValue
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretValueRequest"
            example:
              value:
                url: "postgres://user:updated@host:5432/mydb"
              cas: 1
      responses:
        "200":
          description: Secret value updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/undelete:
    post:
      tags:
        - Secret Store
      summary: Undelete secret versions
      description: "Restores specified soft-deleted versions and reactivates the secret. Requires scope: secret-store.write."
      operationId: undeleteSecret
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretVersionsRequest"
            example:
              versions: [2]
      responses:
        "200":
          description: Secret versions restored successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/destroy:
    post:
      tags:
        - Secret Store
      summary: Destroy secret versions
      description: "Irreversibly destroys specified secret versions. Requires scope: secret-store.write."
      operationId: destroySecretVersions
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretVersionsRequest"
            example:
              versions: [1]
      responses:
        "200":
          description: Secret versions permanently destroyed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretLifecycleStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/permanent:
    delete:
      tags:
        - Secret Store
      summary: Permanently delete secret
      description: "Irreversibly deletes all versions and metadata for a secret. Requires scope: secret-store.write."
      operationId: permanentlyDeleteSecret
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret permanently deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretLifecycleStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/versions:
    get:
      tags:
        - Secret Store
      summary: List secret versions
      description: "Returns version metadata without secret values. Requires scope: secret-store.read."
      operationId: listSecretVersions
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Secret version metadata returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretVersions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/versions/{version}:
    get:
      tags:
        - Secret Store
      summary: Get secret version
      description: "Returns the value and metadata for one secret version. Requires scope: secret-store.read."
      operationId: getSecretVersion
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/SecretVersion"
      responses:
        "200":
          description: Secret version returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/secrets/{secret_id}/rollback:
    post:
      tags:
        - Secret Store
      summary: Roll back secret value
      description: "Copies a previous version into a new current version. Requires scope: secret-store.write."
      operationId: rollbackSecret
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/SecretId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackSecretRequest"
            example:
              version: 1
      responses:
        "200":
          description: Previous value copied into a new current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /secret-store/stores/{store_id}/identities:
    get:
      tags: [Secret Store]
      summary: List application identities
      description: "Lists AppRole and Kubernetes identities bound to a store. Requires scope: secret-store.read."
      operationId: listSecretIdentities
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Identities returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretIdentityList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Secret Store]
      summary: Create application identity
      description: "Creates an AppRole or Kubernetes identity with an initial scope for this store. Requires scope: secret-store.write."
      operationId: createSecretIdentity
      x-ibee-required-scope: secret-store.write
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretIdentityRequest"
            examples:
              approle:
                summary: AppRole identity for a VM or script
                value:
                  auth_method: approle
                  name: payments-api
                  token_policy_mode: read_only
              kubernetes:
                summary: Kubernetes workload identity
                value:
                  auth_method: kubernetes
                  name: payments-worker
                  token_policy_mode: read_only
                  k8s_namespace: production
                  k8s_service_account: payments-worker
      responses:
        "201":
          description: Identity created successfully. Fetch access details separately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretIdentity"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /secret-store/identities/{identity_id}:
    get:
      tags: [Secret Store]
      summary: Get application identity
      description: "Gets one application identity without credentials. Requires scope: secret-store.read."
      operationId: getSecretIdentity
      x-ibee-required-scope: secret-store.read
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdentityId"
      responses:
        "200":
          description: Identity returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretIdentity"
        "401": { $ref: "#/components/responses/Unauthorized" }
