    CreateBucketRequest:
      type: object
      required:
        - name
        - region
      properties:
        name:
          title: Bucket name
          type: string
          minLength: 3
          maxLength: 63
          example: production-assets
          description: Unique bucket name within the workspace.
        region:
          title: Region
          type: string
          example: in-south-2
          description: >-
            Required Object Storage region identifier. This must match a region
            configured for the target environment; it is not a compute
            `site_id` or display name.
        is_public:
          title: Public access
          type: boolean
          default: false
          description: Whether the bucket allows unauthenticated read access.
        object_lock_enabled:
          type: boolean
          default: false
          description: Must be `true` when `default_retention` is provided.
        default_retention:
          $ref: "#/components/schemas/DefaultRetention"
        tags:
          type: array
          items:
            type: string
          description: Optional tags stored alongside bucket metadata.
      additionalProperties: false

    DefaultRetention:
      type: object
      description: >-
        Optional default object retention. Supply exactly one of `days` or
        `years`, and set `object_lock_enabled` to `true`.
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - GOVERNANCE
            - COMPLIANCE
        days:
          type: integer
          minimum: 1
          maximum: 36500
          nullable: true
        years:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
      additionalProperties: false

    UpdateBucketRequest:
      type: object
      required:
        - is_public
      properties:
        is_public:
          type: boolean

    Bucket:
      type: object
      description: >-
        An object storage bucket. Read and list responses carry the usage
        counters `object_count` and `total_size`; the create response omits
        them because usage is only measured once the bucket exists.
      required:
        - name
        - is_public
        - region
        - plan
        - status
        - site_id
        - site_name
        - bucket_lock_enabled
        - created_at
        - updated_at
      properties:
        name:
          type: string
          example: production-assets
          description: Unique bucket name within the workspace.
        is_public:
          type: boolean
          example: false
          description: Whether the bucket allows unauthenticated read access.
        region:
          type: string
          nullable: true
          example: in-south-2
          description: Object storage region the bucket lives in.
        plan:
          type: string
          nullable: true
          example: standard
          description: Storage plan billed for the bucket.
        status:
          type: string
          nullable: true
          example: active
          description: Current bucket status.
        site_id:
          type: string
          nullable: true
          example: "3"
          description: >-
            Identifier of the site holding the bucket. Placement is managed
            internally.
        site_name:
          type: string
          nullable: true
          example: Hyderabad
          description: Human-readable name of the site holding the bucket.
        bucket_lock_enabled:
          type: boolean
          example: false
          description: Whether object lock is enabled on the bucket.
        object_count:
          type: integer
          example: 42
          description: >-
            Number of objects stored in the bucket. Returned by the read and
            list endpoints only.
        total_size:
          type: integer
          example: 1048576
          description: >-
            Total size in bytes of the objects stored in the bucket. Returned
            by the read and list endpoints only.
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    BucketList:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/Bucket"
        is_truncated:
          type: boolean
          example: false
        next_continuation_token:
          type: string
          nullable: true

    CreateS3CredentialRequest:
