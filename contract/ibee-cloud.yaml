        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingEligibilityRequest"
            example:
              sku_code: STANDARD-2-8-50
      responses:
        "200":
          description: Billing eligibility decision returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingEligibility"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The eligibility request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Billing returned an invalid or unavailable decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          description: The billing eligibility request timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

