        os_type:
          type: string
          enum:
            - linux
          example: linux
          description: Operating system family.
        template_id:
          type: string
          example: tmpl_ubuntu_2204_cuda
          description: GPU-compatible template ID returned by the compute catalog.
        cpu:
          type: integer
          minimum: 1
          example: 8
          description: Number of vCPUs.
        ram_mb:
          type: integer
          minimum: 512
          example: 32768
          description: RAM in megabytes.
        disk_gb:
          type: integer
          minimum: 10
          nullable: true
          example: 200
          description: Root disk size in gigabytes.
        gpu_count:
          type: integer
          minimum: 1
          example: 1
          description: Number of GPUs to attach.
        gpu_model:
          type: string
          example: A100
          description: "GPU model (e.g. A100, H100, L40S, RTX4090)."
        plan_id:
          type: string
          description: Billable GPU plan ID returned by the compute catalog.
        billing_catalog:
          type: object
          additionalProperties: true
          description: >-
            The selected plan's `billing_catalog` object from
            `GET /compute/plans?vm_type=gpu`, passed through unmodified — the
            same flow the portal uses. Treat it as opaque. Billing charges are
            always computed server-side from `plan_id`, not from this echoed
            copy.
        ssh_key_ids:
          type: array
          items:
            type: string
          description: SSH key IDs to inject into the VM.
        ssh_keys:
          type: array
          items:
            type: string
          description: >-
            Inline public SSH keys to install on the VM, in addition to the
            keys referenced by `ssh_key_ids`.
        vpc_id:
          type: string
          nullable: true
          description: >-
            VPC to launch the VM into. Send it together with `subnet_id`; one
            without the other is refused. Omit both to launch on the public
            provider network.
        subnet_id:
          type: string
          nullable: true
          description: Subnet of `vpc_id` for the VM's VPC NIC. Send it together with `vpc_id`.
        network_connectivity:
          type: string
          enum:
            - private
            - nat
            - public_ip
          nullable: true
          description: >-
            How the VM reaches the internet. With a VPC it defaults to
            `private`. Without a VPC it is accepted only as `public_ip`
            together with `reserved_public_ip_id`, which attaches that
            Reserved IP on the public provider network. `public_ip` is refused
            on a `nat_gateway` VPC, and on a `private` VPC it needs
            `reserved_public_ip_id`.
        vpc_attachment_mode:
          type: string
          enum:
            - primary
          default: primary
          description: >-
            GPU VMs support only `primary`: with a VPC, the VPC NIC is the
            VM's only NIC. `secondary` is refused with 400.
        reserved_public_ip_id:
          type: string
          nullable: true
          description: >-
            Reserved IP to attach at launch. Needs `network_connectivity:
            public_ip`. Accepted with a VPC or, without one, on the public
            provider network.
        tags:
          type: array
          items:
            type: string
          description: Arbitrary tags for filtering and organization.

