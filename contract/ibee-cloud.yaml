      summary: Get static website configuration
      description: "Returns a CDN distribution's static website settings, such as its index document. Requires scope: cdn.read."
      operationId: getCdnWebsiteConfig
      x-ibee-required-scope: cdn.read
      responses:
        "200":
          description: Website configuration returned successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnWebsiteConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [Cdn]
      summary: Enable or update static website configuration
      description: "Turns on static website hosting for a CDN distribution, or changes its index document. Requires scope: cdn.write."
      operationId: updateCdnWebsiteConfig
      x-ibee-required-scope: cdn.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCdnWebsiteConfigRequest" }
      responses:
        "200":
          description: Website configuration updated successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnWebsiteConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Cdn]
      summary: Disable static website configuration
      description: "Turns off static website hosting for a CDN distribution. Requires scope: cdn.write."
      operationId: deleteCdnWebsiteConfig
      x-ibee-required-scope: cdn.write
      responses:
        "200":
          description: Website configuration disabled successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnWebsiteConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cdn/distributions/{distribution_id}/custom-domains:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/CdnDistributionId"
    get:
      tags: [Cdn]
      summary: List CDN custom domains
      description: "Lists the custom domains on a CDN distribution, with their verification and certificate status. Requires scope: cdn.read."
      operationId: listCdnCustomDomains
      x-ibee-required-scope: cdn.read
      responses:
        "200":
          description: Custom domains returned successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnCustomDomainList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Cdn]
      summary: Add CDN custom domain
      description: "Adds a custom domain to a CDN distribution and returns the DNS records needed to verify it. Requires scope: cdn.write."
      operationId: createCdnCustomDomain
      x-ibee-required-scope: cdn.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCdnCustomDomainRequest" }
      responses:
        "201":
          description: Custom domain added successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnCustomDomain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cdn/distributions/{distribution_id}/custom-domains/{domain}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/CdnDistributionId"
      - $ref: "#/components/parameters/CdnDomain"
    get:
      tags: [Cdn]
      summary: Get CDN custom domain
      description: "Returns a CDN custom domain's verification status, DNS instructions, and TLS certificate status. Requires scope: cdn.read."
      operationId: getCdnCustomDomain
      x-ibee-required-scope: cdn.read
      responses:
        "200":
          description: Custom domain returned successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnCustomDomain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Cdn]
      summary: Remove CDN custom domain
      description: "Removes a custom domain from a CDN distribution. Requires scope: cdn.write."
      operationId: deleteCdnCustomDomain
      x-ibee-required-scope: cdn.write
      responses:
        "200": { description: Custom domain removed successfully. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cdn/distributions/{distribution_id}/custom-domains/{domain}/verify:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/CdnDistributionId"
      - $ref: "#/components/parameters/CdnDomain"
    post:
      tags: [Cdn]
      summary: Verify CDN custom domain
      description: "Checks a CDN custom domain's DNS records and updates its verification status. Requires scope: cdn.write."
      operationId: verifyCdnCustomDomain
      x-ibee-required-scope: cdn.write
      responses:
        "200":
          description: Domain verification completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnCustomDomainVerification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /cdn/distributions/{distribution_id}/purge:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/CdnDistributionId"
    post:
      tags: [Cdn]
      summary: Purge CDN cache
      description: |
        Purges matching cache content synchronously for a distribution in the
        selected workspace. For a normal single-page application deployment,
        use `mode: url` with `paths: ["/index.html"]`. Do not purge
        fingerprinted assets such as `/assets/app.a91c3.js`; use `paths:
        ["/*"]` only for an emergency full-cache invalidation.
      operationId: purgeCdnCache
      x-ibee-required-scope: cdn.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeCdnCacheRequest" }
            example:
              mode: url
              paths: ["/index.html"]
      responses:
        "200":
          description: Cache purge completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CdnCachePurge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    IbeeApiToken:
      type: http
      scheme: bearer
      bearerFormat: IBEE platform API token
      description: >-
        IBEE platform API token. Production tokens start with `ibee_prod_key_`;
        development tokens start with `ibee_dev_key_`. Use a token only with
        its matching gateway environment.

  parameters:
    WorkspaceId:
      name: workspace_id
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[1-9][0-9]*$"
      description: >-
        The positive numeric workspace ID to scope this request to. Zero,
        negative, and non-numeric values are rejected.
      example: "710995"
    BlockVolumeId:
      name: volume_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Workspace-owned block-volume ID.
    CdnDistributionId:
      name: distribution_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: CDN distribution ID.
    CdnDomain:
      name: domain
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 253 }
      description: Fully qualified custom domain.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum number of records to return.
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: >-
        Maximum number of records to return. The server returns 10 when this
        is omitted; use `offset` to read further pages.
    ListOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of records to skip before the first one returned.
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: string
      description: Secret store ID.
      example: "019f1e4b-3edd-72cf-b90e-26864ba2f283"
    SecretId:
      name: secret_id
      in: path
      required: true
      schema:
        type: string
      description: Secret ID.
      example: "019f1e4b-4a2c-71d0-a8b3-c5f92e7d1a4b"
    SecretVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Positive secret version number.
      example: 1
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema:
        type: string
      description: Secret Store application identity ID.
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: string
      description: Secret Store identity scope ID.
    BucketName:
      name: bucket_name
      in: path
      required: true
      schema:
        type: string
      description: Logical bucket name.
    AccessKeyId:
      name: access_key_id
      in: path
      required: true
      schema:
        type: string
      description: S3 access key ID.
    VmId:
      name: vm_id
      in: path
      required: true
      schema:
        type: string
      description: Virtual machine ID.
    SnapshotSetId:
      name: snapshot_set_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: VM snapshot-set ID.
    ConsoleSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: VM console session ID.
    RestoreId:
      name: restore_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Snapshot or backup restore operation ID.
    BackupRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Backup run or recovery-point ID.
    VpcId:
      name: vpc_id
      in: path
      required: true
      schema:
        type: string
      description: VPC ID.
    SubnetId:
      name: subnet_id
      in: path
      required: true
      schema:
        type: string
      description: Subnet ID.
    NatGatewayId:
      name: nat_gateway_id
      in: path
      required: true
      schema:
        type: string
      description: NAT gateway ID.
    ReservedIpId:
      name: reserved_ip_id
      in: path
      required: true
      schema:
        type: string
      description: Reserved IP ID.
    PortForwardingRuleId:
      name: port_forwarding_rule_id
      in: path
      required: true
      schema:
        type: string
      description: NAT port-forwarding rule ID.
    FirewallGroupId:
      name: firewall_group_id
      in: path
      required: true
      schema:
        type: string
      description: Firewall group ID.
    FirewallRuleId:
      name: firewall_rule_id
      in: path
      required: true
      schema:
        type: string
      description: Firewall rule ID.
    LoadBalancerId:
      name: load_balancer_id
      in: path
      required: true
      schema:
        type: string
      description: Load balancer ID.
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Unique key used to safely retry write operations.

  responses:
    BadRequest:
      description: >-
        The request is invalid. From the gateway: `workspace_id_required` or
        `invalid_workspace_id`; on billable creates also `invalid_json_body`
        and selection codes such as `plan_id_required`, `invalid_site_id`,
        `compute_billing_term_required` or
        `invalid_block_storage_selection`. Otherwise the product service's
        `detail`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        The API token is missing, malformed or unknown (`invalid_api_key`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The token may not make this call. Gateway codes: `insufficient_scope`
        (with `required_scope`), `key_revoked`, `key_disabled`,
        `key_inactive`, `key_expired`, `unknown_route`,
        `workspace_not_allowed`, `principal_inactive`, `principal_not_member`
        and `principal_permission_denied`. On writes, also
        `organization_restricted` (an admin restricted the organization) and
        `verification_required` (the token's user has not completed identity
        verification). A product service may also refuse with `detail`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: >-
        Billing refused the request (`billing_denied`). `billing_reason`
        carries Billing's reason unchanged, for example
        `insufficient_balance`, `credit_limit_exceeded`,
        `initial_topup_required`, `resource_limit_reached` (a plan limit) or
        `resource_usage_unavailable` (Billing could not count usage).
        `billing_sku_code`, `billing_evaluated_at` and `admission_context_id`
        identify the decision. Nothing is provisioned; resolve the reason and
        retry with the same idempotency key where supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Locked:
      description: >-
        The organization is suspended (`organization_suspended`), so writes
        are refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        A concurrency limit was reached. Retry later. For console sessions,
        `detail.code` is `user_limit` or `workspace_limit` (active sessions
        per user or per workspace).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >-
        A service the request depends on did not answer. Gateway codes:
        `workspace_verification_unavailable`,
        `principal_verification_unavailable` and
        `principal_authorization_unavailable`; on billable creates also
        `billing_admission_timeout`, `billing_admission_unavailable`,
        `billing_admission_disabled`, `billing_admission_not_configured` and
        the catalog codes `compute_catalog_unavailable`,
        `compute_catalog_not_configured`, `product_catalog_timeout`,
        `product_catalog_unavailable`, `product_catalog_not_configured` and
        `unsupported_product_quote`.
        Otherwise the product service's `detail`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    VmType:
      type: string
      enum:
        - cloud
        - gpu

    BillingInterval:
      type: string
      enum:
        - HOURLY
        - MONTHLY
      default: MONTHLY

    ComputeSite:
      type: object
      required:
        - site_id
        - name
      properties:
        site_id:
          type: string
          description: >-
            Canonical opaque placement ID accepted by VM creation. Copy it
            exactly; do not substitute `site_code`, `region_id`, or `name`.
        site_code:
          type: string
          nullable: true
        name:
          type: string
        location:
          type: string
          nullable: true
        region_id:
          type: string
          nullable: true
        country_id:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true

    ComputeSiteList:
      type: object
      required:
        - sites
        - count
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/ComputeSite"
        count:
          type: integer
          minimum: 0

    ComputePlan:
      type: object
      required:
        - plan_id
        - vm_type
        - name
        - code
        - cpu
        - ram_mb
        - disk_gb
        - gpu_count
        - selectable
        - pricing_status
        - currency
        - billing_interval
      properties:
        plan_id:
          type: string
          description: Plan ID accepted by VM creation.
        vm_type:
          $ref: "#/components/schemas/VmType"
        name:
          type: string
        code:
          type: string
        cpu:
          type: integer
          minimum: 1
        ram_mb:
          type: integer
          minimum: 512
        disk_gb:
          type: integer
          minimum: 10
        gpu_count:
          type: integer
          minimum: 0
        gpu_model:
          type: string
          nullable: true
        gpu_memory_gb:
          type: number
          minimum: 0
          nullable: true
        selectable:
          type: boolean
        pricing_status:
          type: string
          enum:
            - priced
            - unpriced
        currency:
          type: string
        billing_interval:
          $ref: "#/components/schemas/BillingInterval"
        hourly_price_minor:
          type: integer
          minimum: 0
          nullable: true
        monthly_price_minor:
          type: integer
          minimum: 0
          nullable: true
        site_id:
          type: string
          nullable: true
        billing_catalog:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Canonical billing SKU reference for this plan. Pass this object
            unmodified as `billing_catalog` when creating a VM with this
            plan — the same flow the portal uses. Treat it as opaque;
            its fields may grow over time. Billing charges are always
            computed server-side from `plan_id`, not from this echoed copy.

    ComputePlanList:
      type: object
      required:
        - plans
        - count
        - vm_type
        - currency
        - billing_interval
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/ComputePlan"
        count:
          type: integer
          minimum: 0
        vm_type:
          $ref: "#/components/schemas/VmType"
        site_id:
          type: string
          nullable: true
        currency:
          type: string
        billing_interval:
          $ref: "#/components/schemas/BillingInterval"

    ComputeImage:
      type: object
      required:
        - template_id
        - name
        - os_distro
        - os_type
        - architecture
        - size_bytes
        - gpu_compatible
        - compatible_vm_types
        - site_ids
      properties:
        template_id:
          type: string
          description: Template ID accepted by VM creation.
        name:
          type: string
        description:
          type: string
          nullable: true
        os_distro:
          type: string
        os_type:
          type: string
          enum:
            - linux
            - windows
        distro_version:
          type: string
          nullable: true
        architecture:
          type: string
        image_format:
          type: string
          nullable: true
        size_bytes:
          type: integer
          minimum: 0
        gpu_compatible:
          type: boolean
        compatible_vm_types:
          type: array
          items:
            $ref: "#/components/schemas/VmType"
        site_ids:
          type: array
          items:
            type: string

    ComputeImageList:
      type: object
      required:
        - images
        - count
        - vm_type
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/ComputeImage"
        count:
          type: integer
          minimum: 0
        vm_type:
          $ref: "#/components/schemas/VmType"
        site_id:
          type: string
          nullable: true

    NetworkingSite:
      type: object
      required:
        - site_id
        - site_name
        - available
      properties:
        site_id:
          type: string
          description: >-
            Canonical opaque site identifier accepted by VPC and Reserved IP
            creation. Copy it exactly; do not substitute a region or site name.
        site_name:
          type: string
        available:
          type: boolean
        message:
          type: string
          nullable: true

    CreateVpcRequest:
      type: object
      required:
        - name
        - site_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          default: ""
        site_id:
          type: string
          minLength: 1
          maxLength: 120
          example: 68b99bd78a8eda32ff3f16ea
          description: >-
            Required network placement site. Copy `site_id` from
            `GET /networking/sites` and choose an entry where `available` is
            `true`. Do not use a region name.
        region:
          type: string
          nullable: true
        cidr:
          type: string
          nullable: true
          description: RFC1918 IPv4 CIDR with a prefix between /22 and /28.
          example: 10.144.0.0/22
        auto_cidr:
          type: boolean
          default: true
        create_default_subnet:
          type: boolean
          default: true
        default_subnet_cidr:
          type: string
          nullable: true
        is_default:
          type: boolean
          default: false
        connectivity_type:
          type: string
          enum:
            - public
            - private
            - nat_gateway
          default: public
          description: >-
            The VPC's internet model; the server uses `public` when this is
            omitted. `public` keeps dedicated public IPs available to its VMs.
            `private` has no shared public edge, but a VM can still be given a
            Reserved IP. `nat_gateway` is a private VPC with managed outbound
            NAT and refuses dedicated public IPs.

    UpdateVpcRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500

    Vpc:
      type: object
      required:
        - vpc_id
        - organization_id
        - workspace_id
        - site_id
        - name
        - cidr
        - status
        - connectivity_type
        - created_at
        - updated_at
      properties:
        vpc_id:
          type: string
        account_id:
          type: string
        organization_id:
          type: string
        workspace_id:
          type: string
        site_id:
          type: string
        name:
          type: string
        description:
          type: string
        region:
          type: string
          nullable: true
        cidr:
          type: string
        status:
          $ref: "#/components/schemas/NetworkingResourceStatus"
        is_default:
          type: boolean
        connectivity_type:
          type: string
          enum:
            - public
            - private
            - nat_gateway
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
