      parameters:
        - $ref: "#/components/parameters/ContainerRegistryRepositoryName"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ContainerRegistryPageSize"
      responses:
        "200":
          description: Artifacts returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryArtifactList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/artifacts/{reference}:
    parameters:
