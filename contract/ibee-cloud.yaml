          type: string

    DeleteResponse:
      type: object
      properties:
        detail:
          type: string
          example: Deleted successfully

    VmDeleteRequest:
      type: object
      description: >-
        Optional VM delete body. A VM whose public IP was assigned
        automatically is refused with 400 unless `public_ip_action` is set.
      properties:
        public_ip_action:
          type: string
          enum:
            - reserve
            - release
          nullable: true
          description: >-
            What to do with the VM's automatically assigned public IP.
            `reserve` converts it to a Reserved IP in this workspace;
            `release` releases it with the VM. Required when the VM has an
            automatically assigned public IP. `reserve` on a VM without one is
            refused with 400.
        reserved_ip_label:
          type: string
          maxLength: 120
          nullable: true
          description: >-
            Label for the Reserved IP that `reserve` creates. Blank is treated
            as not set.
        reserved_ip_billing_catalog:
          type: object
          additionalProperties: true
          nullable: true
          required:
            - sku_id
          properties:
            sku_id:
              oneOf:
                - type: string
                - type: number
              description: Billing catalog SKU ID of the Reserved IP.
          description: >-
            Billing catalog identifiers used to bill the Reserved IP that
            `reserve` creates. Required with `public_ip_action: reserve`, with a
            non-empty `sku_id`; refused with 400 otherwise.

    BillingCatalogSelection:
      type: object
      description: >-
        A Billing catalog SKU selection as the VM engine accepts it.
        `sku_id` and `sku_code` are required; other catalog fields are
        accepted and stored as sent.
      required:
        - sku_id
        - sku_code
      additionalProperties: true
      properties:
        sku_id:
          oneOf:
            - type: string
            - type: number
          description: Billing catalog SKU ID.
        sku_code:
          type: string
          minLength: 1
          description: Billing catalog SKU code. Stored in upper case.
        product_id:
          oneOf:
            - type: string
            - type: number
          nullable: true
          description: Billing catalog product ID.
        product_code:
          type: string
          nullable: true
          description: Billing catalog product code.
        display_name:
          type: string
          nullable: true

    CreateCloudVmRequest:
      type: object
      required:
        - name
        - plan_id
        - template_id
        - os_distro
        - os_type
        - cpu
        - ram_mb
        - billing_catalog
      properties:
        name:
          type: string
          minLength: 1
          example: web-server-01
          description: Display name for the virtual machine.
        site_id:
          type: string
          minLength: 1
          nullable: true
          description: >-
            Optional placement site ID. Omit for automatic placement. To pin
            the VM, copy `site_id` from `GET /compute/sites` and use the same
            value when filtering plans and images.
        os_distro:
          type: string
          example: ubuntu
          description: "Operating system distribution (e.g. ubuntu, centos, debian, rocky, windows)."
        os_type:
          type: string
          enum:
            - linux
            - windows
          example: linux
          description: Operating system family.
        template_id:
          type: string
          example: tmpl_ubuntu_2204
          description: OS template or image ID returned by the compute catalog.
        cpu:
          type: integer
          minimum: 1
          example: 2
          description: Number of vCPUs.
        ram_mb:
          type: integer
          minimum: 512
          example: 4096
          description: RAM in megabytes.
        disk_gb:
          type: integer
          minimum: 10
          nullable: true
          example: 80
          description: Root disk size in gigabytes.
        plan_id:
          type: string
          description: Billable compute plan ID returned by the compute catalog.
        billing_catalog:
          type: object
          additionalProperties: true
          description: >-
            The selected plan's `billing_catalog` object from
            `GET /compute/plans`, passed through unmodified — the same flow
            the portal uses. Treat it as opaque. Billing charges are always
            computed server-side from `plan_id`, not from this echoed copy.
        ssh_key_ids:
          type: array
          items:
            type: string
          description: SSH key IDs to inject into the VM.
        ssh_keys:
          type: array
          items:
            type: string
          description: >-
            Inline public SSH keys to install on the VM, in addition to the
            keys referenced by `ssh_key_ids`.
        vpc_id:
          type: string
          nullable: true
          description: >-
            VPC to launch the VM into. Send it together with `subnet_id`; one
            without the other is refused. Omit both to launch on the public
            provider network.
        subnet_id:
          type: string
          nullable: true
          description: Subnet of `vpc_id` for the VM's VPC NIC. Send it together with `vpc_id`.
        network_connectivity:
          type: string
          enum:
            - private
            - nat
            - public_ip
          nullable: true
          description: >-
            How the VM reaches the internet. With a VPC it defaults to
            `private`. Without a VPC it is accepted only as `public_ip`
            together with `reserved_public_ip_id`, which attaches that
            Reserved IP on the public provider network. `public_ip` is refused
            on a `nat_gateway` VPC, and on a `private` VPC it needs
            `reserved_public_ip_id`.
        vpc_attachment_mode:
          type: string
          enum:
            - primary
            - secondary
          default: primary
          description: >-
            With a VPC, `primary` makes the VPC NIC the VM's only NIC.
            `secondary` keeps the public provider NIC as primary and adds the
            VPC as a second NIC; it needs `vpc_id` and `subnet_id` and cannot
            be combined with `reserved_public_ip_id`.
        reserved_public_ip_id:
          type: string
          nullable: true
          description: >-
            Reserved IP to attach at launch. Needs `network_connectivity:
            public_ip` and the `primary` attachment mode. Accepted with a VPC
            or, without one, on the public provider network.
        tags:
          type: array
          items:
            type: string
          description: Arbitrary tags for filtering and organization.

    CreateGpuVmRequest:
      type: object
      required:
        - name
        - plan_id
        - template_id
        - os_distro
        - os_type
        - cpu
        - ram_mb
        - gpu_count
