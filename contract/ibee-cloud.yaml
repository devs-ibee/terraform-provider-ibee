        idle_timeout_seconds: { type: integer }
        max_duration_seconds: { type: integer }
        state: { $ref: "#/components/schemas/VmConsoleState" }

    VmConsoleSessionStatus:
      type: object
      required: [session_id, vm_id, vm_type, console_type, state, host_id, host_mgmt_ip, socket_path, created_at, idle_timeout_seconds, max_duration_seconds]
      properties:
        session_id: { type: string }
        vm_id: { type: string }
        organization_id: { type: string, nullable: true }
        workspace_id: { type: string, nullable: true }
        workspace_name: { type: string, nullable: true }
        vm_type: { $ref: "#/components/schemas/VmType" }
        console_type: { type: string, enum: [graphical] }
        state: { $ref: "#/components/schemas/VmConsoleState" }
        host_id: { type: string }
        host_mgmt_ip: { type: string }
        socket_path: { type: string }
        created_at: { type: string, format: date-time }
        connected_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        close_reason: { type: string, nullable: true }
        token_expires_at: { type: string, format: date-time, nullable: true }
        idle_timeout_seconds: { type: integer }
        max_duration_seconds: { type: integer }

    VmConsoleState:
      type: string
      enum: [issued, active, closed, failed, expired]

    VmConsoleClose:
      type: object
      required: [session_id, state, close_reason]
      properties:
        session_id: { type: string }
        state: { $ref: "#/components/schemas/VmConsoleState" }
        close_reason: { type: string }

    OperationAccepted:
      type: object
      required:
        - operation_id
        - vm_id
        - status
        - submitted_at
      properties:
        operation_id:
          type: string
          example: op_123
        vm_id:
          type: string
          example: vm_abc123
        status:
          type: string
          example: accepted
        submitted_at:
          type: string
          format: date-time

    OperationStatus:
      type: object
      required:
        - operation_id
        - vm_id
        - action
        - status
        - submitted_at
        - updated_at
      properties:
        operation_id:
          type: string
          example: op_123
        vm_id:
          type: string
          example: vm_abc123
        action:
          type: string
          enum:
            - create
            - start
            - stop
            - reboot
            - delete
            - resize
            - attach_volume
            - detach_volume
            - resize_plan
            - resize_root_disk
            - update_access
            - snapshot
            - restore
            - rebuild
            - rescue
          example: create
        status:
          type: string
          enum:
            - accepted
            - running
            - waiting
            - compensating
            - succeeded
            - failed
            - cancelled
            - timed_out
          example: running
        current_step:
          type: string
          nullable: true
          example: provisioning_network
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateBlockVolumeRequest:
      type: object
      additionalProperties: false
      required: [name, size_gb, site_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size_gb: { type: integer, minimum: 1, maximum: 10000 }
        site_id: { type: string, minLength: 1 }
        site_name: { type: string, nullable: true }
        sku_code:
          type: string
          nullable: true
          description: Optional public selector returned by the server-owned Block Storage catalog. The edge resolves all price and catalog metadata; callers cannot submit pricing.
        volume_class: { type: string, enum: [capacity, balanced, performance], default: balanced }
        replica_count: { type: integer, minimum: 1, maximum: 5, default: 2 }
        backup_enabled: { type: boolean, default: true }
        idempotency_key: { type: string, nullable: true }

    BlockVolumeAttachment:
      type: object
      required: [node_name, mode, device_path, attached_at]
      properties:
        node_name: { type: string }
        mode: { type: string, enum: [single-writer, multi-writer] }
        device_path: { type: string }
        vm_id: { type: string, nullable: true }
        vm_name: { type: string, nullable: true }
        attached_at: { type: string, format: date-time }

    BlockVolume:
      type: object
      required: [id, name, size_gb, state, volume_class, replica_count, attachments, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        workspace_id: { type: string }
        workspace_name: { type: string, nullable: true }
        site_id: { type: string, nullable: true }
        site_name: { type: string, nullable: true }
        name: { type: string }
        size_gb: { type: integer }
        state: { type: string, enum: [creating, ready, in-use, attaching, detaching, resizing, deleting, error] }
        volume_class: { type: string, enum: [capacity, balanced, performance] }
        replica_count: { type: integer }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/BlockVolumeAttachment" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BlockVolumeOperation:
      type: object
      required: [id, volume_id, operation, status, created_at, started_at]
      properties:
        id: { type: string }
        volume_id: { type: string }
        operation: { type: string, enum: [create, attach, detach, resize, delete] }
        status: { type: string, enum: [in-progress, succeeded, failed] }
        idempotency_key: { type: string, nullable: true }
        result: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    BlockVolumeAction:
      type: object
      required: [volume, operation]
      properties:
        volume: { $ref: "#/components/schemas/BlockVolume" }
        operation: { $ref: "#/components/schemas/BlockVolumeOperation" }

    BlockVolumeDelete:
      type: object
      required: [status, id, operation_id]
      properties:
        status: { type: string, enum: [deleted] }
        id: { type: string }
        operation_id: { type: string }

    AttachBlockVolumeRequest:
      type: object
      required: [node_name]
      properties:
        node_name: { type: string, minLength: 1 }
        mode: { type: string, enum: [single-writer, multi-writer], default: single-writer }
        vm_id: { type: string, nullable: true }
        vm_name: { type: string, nullable: true }
        vm_state: { type: string, enum: [running, stopped, suspended], nullable: true }
        vm_site_id: { type: string, nullable: true }
        vm_type: { type: string, enum: [cloud, gpu], default: cloud }
        idempotency_key: { type: string, nullable: true }

    DetachBlockVolumeRequest:
      type: object
      required: [node_name]
      properties:
        node_name: { type: string, minLength: 1 }
        force: { type: boolean, default: false }
        confirm_unmounted: { type: boolean, default: false }
        vm_state: { type: string, enum: [running, stopped, suspended], nullable: true }
        vm_type: { type: string, enum: [cloud, gpu], default: cloud }
        reason: { type: string, nullable: true }
        idempotency_key: { type: string, nullable: true }

    ResizeBlockVolumeRequest:
      type: object
      required: [new_size_gb]
      properties:
        new_size_gb: { type: integer, minimum: 1, maximum: 10000 }
        vm_state: { type: string, enum: [running, stopped, suspended], nullable: true }
        allow_online: { type: boolean, default: false }
        idempotency_key: { type: string, nullable: true }

    GenerateCdnUrlRequest:
      type: object
      required: [bucket_name, object_key]
      properties:
        bucket_name: { type: string, minLength: 1 }
        object_key: { type: string, minLength: 1 }
        expires_in: { type: integer, minimum: 1, nullable: true }
        disposition: { type: string, enum: [inline, attachment], nullable: true }

    GeneratedCdnUrl:
      type: object
      required: [cdn_url]
      properties:
        cdn_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time, nullable: true }

    CreateCdnDistributionRequest:
      type: object
      required: [name, origin_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        origin_type: { type: string, enum: [bucket, custom], default: bucket }
        origin_id: { type: string, minLength: 1 }
        cache_policy: { type: string, enum: [static-assets, media, short, no-cache], default: static-assets }

    UpdateCdnDistributionRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        cache_policy: { type: string, enum: [static-assets, media, short, no-cache] }
        enabled: { type: boolean }

    CdnDistribution:
      type: object
      required: [id, name, origin_type, origin_id, cache_policy, enabled, status, default_domain, default_url, custom_domains, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        origin_type: { type: string, enum: [bucket, custom] }
        origin_id: { type: string }
        cache_policy: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [active, deploying, disabled, failed, deleted] }
        default_domain: { type: string }
        default_url: { type: string, format: uri }
        custom_domains: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    CdnDistributionList:
      type: object
      required: [distributions, count]
      properties:
        distributions: { type: array, items: { $ref: "#/components/schemas/CdnDistribution" } }
        count: { type: integer, minimum: 0 }

    UpdateCdnWebsiteConfigRequest:
      type: object
      properties:
        index_document: { type: string, minLength: 1, maxLength: 1024, default: index.html }

    CdnWebsiteConfig:
      type: object
      required: [distribution_id, enabled, index_document]
      properties:
        distribution_id: { type: string }
        enabled: { type: boolean }
        index_document: { type: string, default: index.html }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    CreateCdnCustomDomainRequest:
      type: object
      required: [domain]
      properties:
        domain: { type: string, minLength: 3, maxLength: 253 }

    CdnCustomDomain:
      type: object
      required: [domain, status, created_at]
      properties:
        domain: { type: string }
        status: { type: string, enum: [pending_validation, pending_tls, active, failed] }
        tls_status: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        instructions: { type: array, items: { type: string }, nullable: true }

    CdnCustomDomainList:
      type: object
      required: [distribution_id, default_domain, custom_domains]
      properties:
        distribution_id: { type: string }
        default_domain: { type: string }
        custom_domains: { type: array, items: { $ref: "#/components/schemas/CdnCustomDomain" } }

    CdnCustomDomainVerification:
      type: object
      required: [domain, status, message]
      properties:
        domain: { type: string }
        status: { type: string, enum: [pending_validation, pending_tls, active, failed] }
        tls_status: { type: string, nullable: true }
        message: { type: string }

    PurgeCdnCacheRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [url, hostname, tag, prefix, all] }
        paths: { type: array, maxItems: 30, items: { type: string } }
        hostnames: { type: array, maxItems: 100, items: { type: string } }
        tags: { type: array, maxItems: 100, items: { type: string } }
        prefixes: { type: array, maxItems: 100, items: { type: string } }

    CdnCachePurge:
      type: object
      required: [success, mode]
      properties:
        success: { type: boolean }
        mode: { type: string, enum: [url, hostname, tag, prefix, all] }
        purged: { type: array, items: { type: string }, nullable: true }
        message: { type: string, nullable: true }

    BillingEligibilityRequest:
      type: object
      properties:
        sku_code:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Billing catalog SKU for the intended resource. Unknown or
            unavailable SKUs may be denied.
          example: STANDARD-2-8-50
        estimated_cost_minor:
          type: integer
          minimum: 0
          description: >-
            Optional estimated cost expressed in the organization's currency
            minor unit. Use a value from a trusted catalog.
          example: 120000
        operation:
          type: string
          enum:
            - CREATE_RESOURCE
            - CREATE_CREDENTIAL
            - INCREASE_CAPACITY
            - MUTATE_RESOURCE
            - READ_RESOURCE
            - DELETE_RESOURCE
            - REVOKE_CREDENTIAL
            - SECURITY_RECOVERY
          default: CREATE_RESOURCE
          description: The kind of action Billing should decide on.
        resource_type:
          type: string
          enum:
            - cpu_vm
            - gpu_vm
            - block_volume
            - snapshot
            - cdn_zone
            - load_balancer
            - public_ipv4
            - bucket
            - secret_store
            - secret
          nullable: true
          description: >-
            What the request would create, so Billing also checks the plan's
            resource limit for it. Omit it for a money check only. `bucket`,
            `secret_store` and `secret` have no limit and get the money check
            only.
        quantity:
          type: integer
          minimum: 0
          maximum: 100000
          default: 1
          description: How many resources would be created at once; 0 for a resize, which adds size only.
        size_gb:
          type: integer
          minimum: 0
          maximum: 1000000000
          nullable: true
          description: >-
            GiB being added (a new volume's size, a resize's increase, or the
            disks a snapshot will capture), checked against the size limit of
            that kind.

    BillingEligibility:
      type: object
      required:
        - organization_id
        - allowed
        - reason
        - billing_mode
        - billing_state
        - currency
        - evaluated_at
      properties:
        organization_id:
          type: string
        allowed:
          type: boolean
          description: Continue only when this value is exactly true.
        reason:
          type: string
          description: >-
            Machine-readable decision reason. A refusal for a plan limit is
            `resource_limit_reached`, with the `resource_limit_*` fields set;
            `resource_usage_unavailable` means Billing could not count usage.
          example: ok
        billing_mode:
          type: string
          enum:
            - PREPAID
            - POSTPAID
        billing_state:
          type: string
          enum:
            - CURRENT
            - PAYMENT_DUE
            - PAST_DUE
            - SOFT_SUSPENDED
            - HARD_SUSPENDED
        currency:
          type: string
          example: INR
        sku_code:
          type: string
          nullable: true
        estimated_cost_minor:
          type: integer
          nullable: true
        effective_balance_minor:
          type: integer
          nullable: true
        credit_headroom_minor:
          type: integer
          nullable: true
        resource_limits:
          type: object
          additionalProperties:
            type: integer
          description: >-
            How many of each resource the organization's plan allows, keyed by
            limit (for example `cpu_vm` or `block_storage_gb`). A missing key
            or `-1` means unlimited.
        resource_limit_key:
          type: string
          nullable: true
          description: The limit that refused the request, when a resource limit decided it.
        resource_limit:
          type: integer
          nullable: true
          description: The value of that limit.
        resource_usage:
          type: number
          nullable: true
          description: Current usage counted against that limit (a count, or GiB for a size limit).
        evaluated_at:
          type: string
          format: date-time

    Error:
      type: object
      description: >-
        Error body. A refusal from the gateway's authorization step
        (auth-service ext-authz) carries `error` and the other fields below
        except `detail`; each of them is present, null when it does not apply.
        A refusal from the product service behind the gateway carries
        `detail` instead.
      properties:
        error:
          type: string
          nullable: true
          description: >-
            Machine-readable code from the gateway's authorization step, for
            example `invalid_api_key`, `insufficient_scope`,
            `organization_restricted`, `organization_suspended`,
            `verification_required` or `billing_denied`. The response
            descriptions list the codes for each status.
          example: insufficient_scope
        required_scope:
          type: string
          nullable: true
          description: The scope the token lacks, with `insufficient_scope`.
          example: vm.write
        billing_reason:
          type: string
          nullable: true
          description: >-
            Billing's reason with `billing_denied`, passed through unchanged:
            for example `insufficient_balance`, `credit_limit_exceeded`,
            `initial_topup_required`, `resource_limit_reached` or
            `resource_usage_unavailable`.
        billing_sku_code:
          type: string
          nullable: true
          description: The SKU the billing admission checked, when there was one.
        billing_evaluated_at:
          type: string
          nullable: true
          description: When Billing made the decision, as Billing returned it.
        admission_context_id:
          type: string
          nullable: true
          description: >-
            Billing admission context for this request, derived from the
            token, workspace, route and `X-Idempotency-Key`, so a retry with
            the same key gets the same id.
        detail:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
          description: Error detail from the product service.
          example: Forbidden
