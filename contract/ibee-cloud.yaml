  # Container Registry. The gateway forwards each path below, and only these
  # paths, to the container-registry service's /api/v1 routes. The service owns
  # ownership, lifecycle and Billing checks; the contract adds no rule of its
  # own. Schemas follow IBEE/container-registry src/ibee_container_registry/
  # schemas.py; internal fields the service also returns (harbor_project_id,
  # harbor_project_name, last_error) are deliberately not part of the contract.
  /container-registry/registry-names/{registry_name}/availability:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: registry_name
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 48
          pattern: "^[a-z][a-z0-9-]{1,46}[a-z0-9]$"
        description: Registry name to check.
    get:
      tags: [ContainerRegistry]
      summary: Check registry name availability
      description: "Checks whether a registry name is free across IBEE. Names are global and never reassigned; unavailable names come with suggestions. Requires scope: container-registry.read."
      operationId: checkContainerRegistryNameAvailability
      x-ibee-required-scope: container-registry.read
      responses:
        "200":
          description: Availability returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryNameAvailability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      tags: [ContainerRegistry]
      summary: List registries
      description: "Lists the workspace's registries, newest first. Paged with `page` and `page_size` (at most 100). Requires scope: container-registry.read."
      operationId: listContainerRegistries
      x-ibee-required-scope: container-registry.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ContainerRegistryPageSize"
      responses:
        "200":
          description: Registries returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [ContainerRegistry]
      summary: Create registry
      description: |
        Creates a registry with a storage plan (`billing_catalog.sku_code`).
        The registry service asks Billing whether the workspace may buy that
        plan and refuses with 403 `billing_resource_not_eligible` (and a
        `reason`) when it may not. Returns 201 when the registry is active, or
        202 while provisioning finishes in the background; poll the registry
        until `observed_state` is `ACTIVE`. Requires scope:
        container-registry.write.
      operationId: createContainerRegistry
      x-ibee-required-scope: container-registry.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContainerRegistryRequest" }
            example:
              registry_name: acme-apps
              confirm_registry_name: acme-apps
              visibility: PRIVATE
              security:
                vulnerability_pull_policy: ALLOW
              billing_catalog:
                sku_code: REGISTRY-STORAGE-250GB
      responses:
        "201":
          description: Registry created and active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "202":
          description: Registry accepted; provisioning continues in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    get:
      tags: [ContainerRegistry]
      summary: Get registry
      description: "Returns one registry, including its visibility, pull policy and provisioning state. A deleted registry is still returned, with `deleted_at` set. Requires scope: container-registry.read."
      operationId: getContainerRegistry
      x-ibee-required-scope: container-registry.read
      responses:
        "200":
          description: Registry returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [ContainerRegistry]
      summary: Delete registry
      description: "Starts deleting a registry; returns 202 with `observed_state: DELETING`. The registry must be empty: 409 with `detail.code: registry_not_empty` otherwise (see Empty registry). The name is never reused. Requires scope: container-registry.write."
      operationId: deleteContainerRegistry
      x-ibee-required-scope: container-registry.write
      parameters:
        - $ref: "#/components/parameters/ContainerRegistryConfirmName"
      responses:
        "202":
          description: Deletion accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/visibility:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    patch:
      tags: [ContainerRegistry]
      summary: Change registry visibility
      description: "Makes a registry private or public. Public requires `acknowledge_public_egress_charges: true`, because anonymous pull bandwidth is billed to the workspace. Returns 202 while the change is applied. Requires scope: container-registry.write."
      operationId: updateContainerRegistryVisibility
      x-ibee-required-scope: container-registry.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContainerRegistryVisibilityRequest" }
            example:
              visibility: PUBLIC
              acknowledge_public_egress_charges: true
      responses:
        "202":
          description: Visibility change accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    post:
      tags: [ContainerRegistry]
      summary: Retry registry provisioning
      description: "Queues the registry's pending change (create, update, upgrade or delete) to run again, for example after `observed_state: ERROR`. Requires scope: container-registry.write."
      operationId: retryContainerRegistryProvisioning
      x-ibee-required-scope: container-registry.write
      responses:
        "202":
          description: Retry queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryReconcile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/package:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    get:
      tags: [ContainerRegistry]
      summary: Get registry storage plan
      description: "Returns the registry's current storage plan, a pending upgrade if there is one, and the status of the change being applied. Requires scope: container-registry.read."
      operationId: getContainerRegistryPackage
      x-ibee-required-scope: container-registry.read
      responses:
        "200":
          description: Plan returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryPackage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/upgrade:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    post:
      tags: [ContainerRegistry]
      summary: Upgrade registry storage plan
      description: |
        Moves an active registry to a larger storage plan. Only larger quotas
        are accepted and only one change can be pending (409 otherwise). The
        registry service asks Billing first and refuses with 403
        `billing_resource_not_eligible` when the plan is not allowed. Send an
        `Idempotency-Key` header: a retry with the same key and plan returns
        the original operation (202 while pending, 200 once applied); the same
        key with a different plan returns 409. Requires scope:
        container-registry.write.
      operationId: upgradeContainerRegistryPackage
      x-ibee-required-scope: container-registry.write
      parameters:
        - $ref: "#/components/parameters/ContainerRegistryIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpgradeContainerRegistryPackageRequest" }
            example:
              billing_catalog:
                sku_code: REGISTRY-STORAGE-500GB
      responses:
        "200":
          description: Replay of an upgrade that has already been applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryPackageOperation" }
        "202":
          description: Upgrade accepted and pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryPackageOperation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/access-tokens:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    get:
      tags: [ContainerRegistry]
      summary: List registry access tokens
      description: "Lists the access tokens that can use this registry, newest first. Secrets are never returned. Requires scope: container-registry.read."
      operationId: listContainerRegistryAccessTokens
      x-ibee-required-scope: container-registry.read
      parameters:
        - name: include_revoked
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Include revoked tokens.
      responses:
        "200":
          description: Tokens returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContainerRegistryAccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [ContainerRegistry]
      summary: Create registry access token
      description: |
        Creates a Docker login credential for the registry. The `username`
        and `secret` are returned once and cannot be read again. The registry
        must be active, and the registry service asks Billing whether the
        workspace may create credentials. Requires scope:
        container-registry.write.
      operationId: createContainerRegistryAccessToken
      x-ibee-required-scope: container-registry.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContainerRegistryAccessTokenRequest" }
            example:
              token_name: production-k8s
              permission: PULL
              expires_in_days: 90
      responses:
        "201":
          description: Token created. Store the secret now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryAccessTokenSecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/access-tokens/{token_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
      - $ref: "#/components/parameters/ContainerRegistryTokenId"
    post:
      tags: [ContainerRegistry]
      summary: Rotate registry access token
      description: "Issues a new secret for an active token; the old secret stops working immediately. The new secret is returned once. Revoked or expired tokens return 409. Requires scope: container-registry.write."
      operationId: rotateContainerRegistryAccessToken
      x-ibee-required-scope: container-registry.write
      responses:
        "200":
          description: Secret rotated. Store the new secret now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryAccessTokenSecret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/access-tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
      - $ref: "#/components/parameters/ContainerRegistryTokenId"
    delete:
      tags: [ContainerRegistry]
      summary: Revoke registry access token
      description: "Revokes a token immediately. Revoking an already revoked token succeeds. Requires scope: container-registry.write."
      operationId: revokeContainerRegistryAccessToken
      x-ibee-required-scope: container-registry.write
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/repositories:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
    get:
      tags: [ContainerRegistry]
      summary: List repositories
      description: "Lists an active registry's repositories. Paged with `page` and `page_size` (at most 100). Requires scope: container-registry.read."
      operationId: listContainerRegistryRepositories
      x-ibee-required-scope: container-registry.read
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[^,%=]+$" }
          description: Fuzzy match on the repository name.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, pull_count, -pull_count, creation_time, -creation_time, update_time, -update_time]
          description: Column to sort by; prefix with `-` for descending.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ContainerRegistryPageSize"
      responses:
        "200":
          description: Repositories returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerRegistryRepositoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ContainerRegistryValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /container-registry/registries/{registry_id}/repositories/{repository_name}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ContainerRegistryId"
