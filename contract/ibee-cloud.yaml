      description: >-
        Returns a point-in-time eligibility decision from the same existing
        billing service used by the portal. Call it before a billable create
        and continue only when `allowed` is exactly `true`.
        This check does not reserve funds, create a resource, or guarantee that
        a later product operation will succeed. Requires scope: billing.read.
